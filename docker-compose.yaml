version: "3.9"

services:
  finance-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: wajira-finance-backend:latest
    container_name: wajira-finance-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - ./.env:/app/.env:ro
    networks:
      - client-wajira-net
      - databases-net

  nginx:
    image: nginx:alpine
    container_name: wajira-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
    depends_on:
      - finance-backend
    networks:
      - client-wajira-net

networks:
  client-wajira-net:
    external: true
  databases-net:
    external: true