stages:
  - deploy

deploy_finance_be_dev:
  stage: deploy
  tags:
    - development
  script:
    - echo "🚀 Memulai sinkronisasi ke folder deployment..."
    
    # 1. Daftarkan folder asli ke safe directory (Cek: tanpa 's' di client)
    - git config --global --add safe.directory /home/alpha-team/development/client/wajira/finance-be
    
    # 2. Pindah ke folder asli di server
    - cd /home/alpha-team/development/client/wajira/finance-be
    
    # 3. Sinkronisasi Kode dari Master (Force Update)
    - echo "🔄 Fetching latest code from master..."
    - git fetch origin master
    - git reset --hard origin/master
    
    # 4. Docker Build & Up
    - echo "🐳 Rebuilding Docker containers..."
    - docker compose up -d --build
    
    # 5. FIX PERMISSION (Solusi error Permission Denied laravel.log)
    - echo "🔓 Setting permissions for storage and cache..."
    - docker exec wajira-finance-backend chown -R www-data:www-data /app/storage /app/bootstrap/cache
    - docker exec wajira-finance-backend chmod -R 775 /app/storage /app/bootstrap/cache
    
    # 6. Database Readiness Check (Tunggu MySQL bangun)
    - echo "⏳ Menunggu database siap (15 detik)..."
    - sleep 15
    
    # 7. Laravel Magic (Migrate & Optimize)
    - echo "✨ Running Laravel artisan commands..."
    - docker exec wajira-finance-backend php artisan migrate:fresh --seed && php artisan db:seed DummyDataSeeder && php artisan db:seed MainCompanyWarehouseSeeder
    - docker exec wajira-finance-backend php artisan optimize:clear
    
    - echo "✅ Wajira Finance BE is officially Live & Stable!"
  only:
    - master