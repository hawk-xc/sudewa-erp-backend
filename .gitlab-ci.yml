    # 0. AMBIL ALIH KEPEMILIKAN
    - sudo chown -R alpha-team:gitlab-runner /home/alpha-team/development/client/wajira/finance-be
    
    # 1. Safe directory
    - git config --global --add safe.directory /home/alpha-team/development/client/wajira/finance-be
    
    # 2. Masuk folder
    - cd /home/alpha-team/development/client/wajira/finance-be
    
    # 3. Sync dari development
    - echo "🔄 Fetching latest code from development..."
    - git fetch origin development
    - git reset --hard origin/development
    # 3. Sync dari development
    - echo "🔄 Fetching latest code from development..."
    - git fetch origin development
    - git reset --hard origin/development
    
    # 4. Docker Build & Up
    - echo "🐳 Rebuilding Docker containers..."
    - docker compose up -d --build
    
    # 5. Permission Laravel
    - echo "🔓 Setting permissions..."
    # 5. Permission Laravel
