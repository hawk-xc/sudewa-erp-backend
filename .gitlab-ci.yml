stages:
  - test
  - deploy

# Stage Test: Validasi kode sebelum masuk ke proses deployment
testing_code:
  stage: test
  image: php:8.3-fpm
  tags:
    - development
  before_script:
    - apt-get update && apt-get install -y unzip libzip-dev
    - docker-php-ext-install zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist
  script:
    - echo "Running syntax check..."
    - find . -path ./vendor -prune -o -name "*.php" -exec php -l {} \;
    # - php vendor/bin/phpunit # Jalankan unit test jika sudah tersedia
  only:
    - master

# Stage Deploy: Update server jika testing berhasil
deploy_dev:
  stage: deploy
  tags:
    - development
  script:
    - cd ~/development/client/wajira/finance-be
    - git fetch origin master
    - git reset --hard origin/master
    - docker-compose up -d --build
    - docker exec wajira-finance-backend php artisan migrate --force
    - docker exec wajira-finance-backend php artisan optimize:clear
  only:
    - master