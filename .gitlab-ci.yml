stages:
  - deploy

deploy_dev:
  stage: deploy
  tags:
    - development  # Ini mastiin script lari di Runner yang ada di server dev kamu
  script:
    - cd ~/development/client/wajira/finance-be
    - git fetch origin master
    - git reset --hard origin/master
    - docker-compose up -d --build
    - docker exec wajira-finance-backend php artisan migrate --force
    - docker exec wajira-finance-backend php artisan optimize:clear
  only:
    - master