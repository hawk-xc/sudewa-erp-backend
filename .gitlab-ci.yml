    - docker exec wajira-finance-backend chown -R www-data:www-data /app/storage /app/bootstrap/cache
    - docker exec wajira-finance-backend chmod -R 775 /app/storage /app/bootstrap/cache
    
    # 6. Wait DB
    - echo "⏳ Menunggu database siap..."
    # 6. Wait DB
